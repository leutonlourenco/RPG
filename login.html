<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <link rel="stylesheet" href="estilos/login.css">
</head>
<body>

    <header class="header-login">

        <nav class="menu">
            <h1 class="logo">
                Filhos do Silêncio
            </h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="personagens.html">Personagens</a>
                <a href="caidos.html">Caídos</a>
                <a href="filhos_do_silencio.html">
                    Campanha
                </a>
                <a href="login.html">
                    Entrar
                </a>
            </div>

        </nav>

    </header>

    <div class="overlay" id="overlay"></div>

    <section class="login-hero">

        <!-- <span class="hero-tag">

            ✠ ACESSO ✠

        </span> -->

        <h2>

            Filhos do Silêncio

        </h2>

        <p>

            Apenas aqueles que conhecem
            o silêncio podem atravessar.

        </p>

    </section>

    <main class="conteiner">

        <section class="login">

            <form
            action="#"
            method="post"
            class="form">

                <div class="login-icon">

                    ✠

                </div>

                <h3>

                    Entrar

                </h3>

                <label class="form_info">

                    <span>

                        E-mail

                    </span>

                    <input

                    type="email"

                    name="email"

                    placeholder="Digite seu e-mail"

                    required>

                </label>

                <label class="form_info">

                    <span>

                        Senha

                    </span>

                    <input

                    type="password"

                    name="password"

                    placeholder="Digite sua senha"

                    required

                    minlength="8">

                </label>

                <div class="check_login">

                    <button type="submit">

                        Entrar

                    </button>

                    <a href="#">

                        Esqueceu sua senha?

                    </a>

                </div>

            </form>

        </section>

    </main>

    <footer>

        <strong>

            &copy; 2026 Supaiddaman

        </strong>

    </footer>

    <script src="JavaScript/script.js"></script>
</body>
</html>
